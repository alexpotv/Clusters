plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alexpotv.kartscreen'
    compileSdk 34

    defaultConfig {
        applicationId 'com.alexpotv.kartscreen'
        minSdk 17
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug   { minifyEnabled false }
        release { minifyEnabled false }
    }
}

dependencies {
    // Provided by the host app at runtime — must NOT be bundled in the APK.
    compileOnly project(':cluster-plugin-api')
    // No third-party dependencies; GLES20 + OBJ parsing are handled in pure Java.
}
