pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'com.android.application' version '8.2.0' apply false
        id 'com.android.library' version '8.2.0' apply false
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "example-1"

include ':cluster-plugin-api'
project(':cluster-plugin-api').projectDir = file('../../../../../cluster-plugin-api')

include ':app'
