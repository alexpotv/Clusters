plugins {
    id 'com.android.application'
}

android {
    // TODO: replace with your own package, e.g. 'com.example.exampleplugin'
    namespace 'com.example.exampleplugin'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.exampleplugin'
        minSdk 17
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
}

dependencies {
    // The API module is provided by the host app at runtime.
    // compileOnly ensures the API classes are not bundled.
    compileOnly project(':cluster-plugin-api')
}
