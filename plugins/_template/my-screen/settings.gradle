pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "my-screen"

// Reference the shared API module from the repository root.
// This path resolves correctly whether you build in Android Studio
// (open this folder as a project) or via CI from the repo root.
include ':cluster-plugin-api'
project(':cluster-plugin-api').projectDir = new File('../../../cluster-plugin-api')

include ':app'
