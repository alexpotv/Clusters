plugins {
    id 'com.android.application'
}

android {
    // TODO: replace with your own package, e.g. 'com.janedev.sunset'
    namespace 'com.example.myplugin'
    compileSdk 34

    defaultConfig {
        // TODO: replace with your own package — must match namespace above
        applicationId 'com.example.myplugin'
        minSdk 17
        targetSdk 34
        versionCode 1          // increment on every release
        versionName '1.0.0'    // must match version in assets/plugin.json
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug   { minifyEnabled false }
        release { minifyEnabled false }
    }
}

dependencies {
    // The API module is provided by the host app at runtime.
    // compileOnly means its classes will NOT be bundled into your APK DEX.
    compileOnly project(':cluster-plugin-api')
}
