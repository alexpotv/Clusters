# GitHub Actions workflow for building and publishing the main app APK on release.
# Triggered when a version tag (e.g. v1.0.0) is pushed. Builds a signed release APK
# and creates a draft GitHub Release with the APK attached. Publish the draft once
# you've reviewed the build and written release notes.

name: App Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (8.5)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-read-only: false

      - name: Decode keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > signing.jks

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$(pwd)/signing.jks \
            -Pandroid.injected.signing.store.password=$SIGNING_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$SIGNING_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$SIGNING_KEY_PASSWORD

      - name: Create draft release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: app/build/outputs/apk/release/*.apk
