# GitHub Actions workflow for Pull‑Request validation
# This runs on every PR that modifies a plugin directory.
# It checks that the plugin.json is well‑formed and builds a debug APK.
# The built APK is cached as an artifact for later inspection.

name: Plugin CI

on:
  pull_request:
    paths:
      - 'plugins/plugins/**/app/**'
      - 'plugins/plugins/**/app/src/**'
      - 'plugins/plugins/**/app/assets/**'

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gradle 9.x requires Java 17+, but AGP 8.2.0 is only compatible with Gradle 8.x.
      # Use Gradle 8.5 to avoid version mismatch.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (8.5)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-read-only: false

      - name: Install Python (for validation scripts)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install required Python packages
        run: pip install -r .github/scripts/requirements.txt || true

      - name: Determine changed plugin directories
        id: changed
        run: |
          # List plugin directories that have any changes under the 'app' folder.
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} \
            | grep '^plugins/plugins/' \
            | grep '/app/' \
            | awk -F'/app/' '{print $1}' \
            | sort -u \
            > changed_plugins.txt
          if [ -s changed_plugins.txt ]; then
            echo "plugins=$(paste -sd',' changed_plugins.txt)" >> $GITHUB_OUTPUT
          else
            echo "plugins=" >> $GITHUB_OUTPUT
          fi

      - name: Fail if no plugin changed
        if: steps.changed.outputs.plugins == ''
        run: |
          echo "No plugin directories changed – nothing to validate." && exit 0

      - name: Validate each changed plugin
        if: steps.changed.outputs.plugins != ''
        run: |
          for PLUGIN in $(echo "${{ steps.changed.outputs.plugins }}" | tr ',' '\n'); do
            echo "Validating $PLUGIN"
            python .github/scripts/validate-plugin.py $PLUGIN
          done

      - name: Build debug APK for each changed plugin
        if: steps.changed.outputs.plugins != ''
        run: |
          for PLUGIN in $(echo "${{ steps.changed.outputs.plugins }}" | tr ',' '\n'); do
            echo "Building plugin $PLUGIN"
            gradle -p "$PLUGIN" :app:assembleDebug --no-daemon
          done

      - name: Upload built APKs as artifacts
        if: steps.changed.outputs.plugins != ''
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: plugins/plugins/**/app/build/outputs/apk/debug/*.apk
