plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.clusterapp'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.clusterapp'
        minSdk 17
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation project(':cluster-plugin-api')
}
